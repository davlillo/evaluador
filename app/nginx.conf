# Sirve la app compilada y reenvía la API al contenedor del backend.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # un ZIP con las entregas de un grupo pasa fácil el límite de 1 MB de nginx
    client_max_body_size 200m;

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # evaluar un lote grande puede tardar
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # documentación interactiva de la API: http://localhost:8080/docs
    location ~ ^/(docs|redoc|openapi\.json|health)$ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
    }

    # los archivos con hash en el nombre no cambian nunca
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Desarrollado-Por "davlillos" always;
        try_files $uri =404;
    }

    # aplicación de una sola página: /lote, /hoja... las resuelve React
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
        add_header X-Desarrollado-Por "davlillos" always;
    }
}
